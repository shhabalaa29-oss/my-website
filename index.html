<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسباتي</title>

<style>
body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}
header{background:#172554;color:#fff;text-align:center;padding:28px}
nav{text-align:center;background:#fff;padding:14px;position:sticky;top:0}
button{border:0;border-radius:10px;padding:11px 16px;margin:4px;cursor:pointer;background:#2563eb;color:#fff}
main{max-width:900px;margin:25px auto;padding:15px}
.card{background:#fff;padding:22px;border-radius:18px;margin-bottom:18px;box-shadow:0 5px 20px #0001}
input,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}
.result{background:#eef6ff;padding:15px;border-radius:10px;font-weight:bold;margin-top:10px}
.hidden{display:none}
.danger{background:#dc2626}
</style>
</head>

<body>

<header>
<h1>حاسباتي</h1>
<p>عملات • عمر • حاسبة عادية</p>
</header>

<nav>
<button onclick="tab('currency')">💱 العملات</button>
<button onclick="tab('age')">🎂 العمر</button>
<button onclick="tab('calc')">🧮 الحاسبة</button>
</nav>

<main>

<section id="currency" class="card">
<h2>💱 حاسبة العملات</h2>

<label>المبلغ</label>
<input id="amount" type="number" value="100">

<label>من</label>
<select id="from"></select>

<label>إلى</label>
<select id="to"></select>

<button onclick="convert()">احسب</button>

<div id="cres" class="result">—</div>
</section>

<section id="age" class="card hidden">
<h2>🎂 حاسبة العمر</h2>

<label>تاريخ الميلاد</label>
<input id="birth" type="date">

<button onclick="calculateAge()">احسب</button>

<div id="ares" class="result">—</div>
</section>

<section id="calc" class="card hidden">
<h2>🧮 الحاسبة</h2>

<input id="screen" readonly value="0" style="font-size:24px">

<div id="keys"></div>
</section>

</main>

<script>

const R = {
USD:1,
JOD:1.41,
EUR:0.85,
SAR:3.75,
AED:3.67,
GBP:0.74,
KWD:0.31,
TRY:41
};

const names = {
USD:"دولار أمريكي",
JOD:"دينار أردني",
EUR:"يورو",
SAR:"ريال سعودي",
AED:"درهم إماراتي",
GBP:"جنيه إسترليني",
KWD:"دينار كويتي",
TRY:"ليرة تركية"
};

const from = document.getElementById("from");
const to = document.getElementById("to");

for (const c in R) {

from.innerHTML +=
`<option value="${c}">${c} - ${names[c]}</option>`;

to.innerHTML +=
`<option value="${c}">${c} - ${names[c]}</option>`;

}

from.value = "JOD";
to.value = "USD";

function convert(){

const amount =
Number(document.getElementById("amount").value) || 0;

const result =
amount / R[from.value] * R[to.value];

document.getElementById("cres").textContent =
`${amount} ${from.value} = ${result.toFixed(2)} ${to.value}`;

}

function tab(id){

document
.querySelectorAll("main section")
.forEach(section =>
section.classList.add("hidden")
);

document
.getElementById(id)
.classList.remove("hidden");

}

function calculateAge(){

const value =
document.getElementById("birth").value;

if(!value){

document.getElementById("ares").textContent =
"الرجاء اختيار تاريخ الميلاد";

return;

}

const birth =
new Date(value + "T00:00:00");

const today =
new Date();

let years =
today.getFullYear() -
birth.getFullYear();

let months =
today.getMonth() -
birth.getMonth();

let days =
today.getDate() -
birth.getDate();

if(days < 0){

months--;

days += new Date(
today.getFullYear(),
today.getMonth(),
0
).getDate();

}

if(months < 0){

years--;

months += 12;

}

document.getElementById("ares").textContent =
`عمرك ${years} سنة و${months} شهر و${days} يوم`;

}

let expression = "";

function press(value){

expression += value;

document.getElementById("screen").value =
expression;

}

function calculate(){

try{

if(!/^[0-9+\-*/(). ]+$/.test(expression))
throw new Error();

expression =
String(Function("return " + expression)());

document.getElementById("screen").value =
expression;

}catch{

document.getElementById("screen").value =
"خطأ";

expression = "";

}

}

const keys = [
"7","8","9","+",
"4","5","6","-",
"1","2","3","*",
"0",".","/","(",")"
];

const keysBox =
document.getElementById("keys");

keys.forEach(function(key){

keysBox.innerHTML +=
`<button onclick="press('${key}')">${key}</button>`;

});

keysBox.innerHTML +=
'<button onclick="calculate()">=</button>';

keysBox.innerHTML +=
'<button class="danger" onclick="expression=\'\';document.getElementById(\'screen\').value=\'0\'">C</button>';

</script>

</body>
</html>

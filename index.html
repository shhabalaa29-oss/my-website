<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسباتي</title>
<style>
body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#172554;color:#fff;text-align:center;padding:28px}
nav{text-align:center;background:#fff;padding:14px;position:sticky;top:0}button{border:0;border-radius:10px;padding:11px 16px;margin:4px;cursor:pointer;background:#2563eb;color:#fff}
main{max-width:900px;margin:25px auto;padding:15px}.card{background:#fff;padding:22px;border-radius:18px;margin-bottom:18px;box-shadow:0 5px 20px #0001}
input,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}.result{background:#eef6ff;padding:15px;border-radius:10px;font-weight:bold;margin-top:10px}
table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee}.hidden{display:none}.danger{background:#dc2626}
</style></head><body>
<header><h1>حاسباتي</h1><p>عملات • عمر • حاسبة عادية</p></header>
<nav><button onclick="tab('currency')">💱 العملات</button><button onclick="tab('age')">🎂 العمر</button><button onclick="tab('calc')">🧮 الحاسبة</button><button onclick="tab('admin')">🔐 الإدارة</button></nav>
<main>
<section id="currency" class="card"><h2>💱 حاسبة العملات</h2>
<label>المبلغ</label><input id="amount" type="number" value="100">
<label>من</label><select id="from"></select><label>إلى</label><select id="to"></select>
<button onclick="convert()">احسب</button><div id="cres" class="result">—</div></section>
<section id="age" class="card hidden"><h2>🎂 حاسبة العمر</h2><label>تاريخ الميلاد</label><input id="birth" type="date"><button onclick="age()">احسب</button><div id="ares" class="result">—</div></section>
<section id="calc" class="card hidden"><h2>🧮 الحاسبة</h2><input id="screen" readonly value="0" style="font-size:24px">
<div id="keys"></div></section>
<section id="admin" class="card hidden"><h2>🔐 لوحة الإدارة</h2>
<div id="login"><input id="user" placeholder="اسم المستخدم"><input id="pass" type="password" placeholder="كلمة السر"><button onclick="login()">دخول</button><p id="msg"></p></div>
<div id="panel" class="hidden"><p>عدّل السعر مقابل الدولار ثم اضغط حفظ.</p><div id="rates"></div><button onclick="saveRates()">حفظ الأسعار</button><button class="danger" onclick="logout()">خروج</button></div>
</section></main>
<script>
let R={}, names={USD:"دولار أمريكي",EUR:"يورو",JOD:"دينار أردني",SAR:"ريال سعودي",AED:"درهم إماراتي",GBP:"جنيه إسترليني",KWD:"دينار كويتي",TRY:"ليرة تركية"};
 function load(){function fill(){from.innerHTML=to.innerHTML="";for(let c in R){from.innerHTML+=`<option>${c}</option>`;to.innerHTML+=`<option>${c}</option>`}from.value="JOD";to.value="USD"}
function convert(){let a=+amount.value||0,v=a/R[from.value]*R[to.value];cres.textContent=`${a} ${from.value} = ${v.toFixed(2)} ${to.value}`}
function tab(id){document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");}
function age(){let b=new Date(birth.value+"T00:00:00"),n=new Date(),y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}ares.textContent=`عمرك ${y} سنة و${m} شهر و${d} يوم`}
let exp="";function p(x){exp+=x;screen.value=exp}function eq(){try{if(!/^[0-9+\\-*/(). ]+$/.test(exp))throw 0;exp=String(Function("return "+exp)());screen.value=exp}catch{screen.value="خطأ";exp=""}}
["+","-","*","/","7","8","9","4","5","6","1","2","3","0",".","(",")"].forEach(x=>keys.innerHTML+=`<button onclick="p('${x}')">${x}</button>`);keys.innerHTML+='<button onclick="eq()">=</button><button class="danger" onclick="exp=\'\';screen.value=0">C</button>';
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user.value,password:pass.value})});if(r.ok){loginBox();}else msg.textContent="بيانات الدخول غير صحيحة"}
function loginBox(){login.classList.add("hidden");panel.classList.remove("hidden");renderRates()}function renderRates(){rates.innerHTML=Object.entries(R).map(([c,v])=>`<p><b>${c}</b> <input data-c="${c}" type="number" step="0.000001" value="${v}"></p>`).join("")}
async function saveRates(){let o={};document.querySelectorAll("#rates input").forEach(i=>o[i.dataset.c]=i.value);let r=await fetch("/api/rates",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});if(r.ok){R=(await r.json()).rates;fill();alert("تم حفظ الأسعار")}else alert("فشل الحفظ")}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()
</script></body></html>
